[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyairobotmodbus"
version = "1.0.0"
description = "Python library for communicating with Airobot ventilation units via Modbus TCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Dāvis Mednis", email = "davis@medn.is" },
]
keywords = ["airobot", "modbus", "ventilation", "hvac", "home-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]
dependencies = [
    "modbus-connection>=4.12",
]

[project.urls]
Homepage = "https://github.com/dmednis/pyairobotmodbus"
Repository = "https://github.com/dmednis/pyairobotmodbus"
Issues = "https://github.com/dmednis/pyairobotmodbus/issues"

[project.scripts]
pyairobotmodbus = "pyairobotmodbus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyairobotmodbus"]

[project.optional-dependencies]
cli = [
    "modbus-connection[tmodbus]>=4.12",
]
dev = [
    "pyairobotmodbus[cli]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "pytest-timeout>=2",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 10
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
explicit_package_bases = true
